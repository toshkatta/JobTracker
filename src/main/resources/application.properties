spring.application.name=jobtracker
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/jobtracker
spring.datasource.username=jobtracker
spring.datasource.password=jobtracker
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.config.import=optional:file:.env[.properties]
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=PT15M
app.jwt.refresh-ttl=P7D
springdoc.swagger-ui.persist-authorization=true
# Must match ApiPaths.API_DOCS (the security rules and tests use that constant)
springdoc.api-docs.path=/docs
# Actuator: expose only the health endpoint, with liveness and readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Finish in-flight requests before stopping (docker stop sends SIGTERM)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
